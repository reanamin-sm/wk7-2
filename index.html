<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중3 필수 영단어 30 Master</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fff4f6;
            background-image: radial-gradient(#ffd8e1 2px, transparent 2px);
            background-size: 20px 20px;
            color: #4a4e69;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .header h1 {
            color: #ff477e;
            font-size: 26px;
            margin-bottom: 4px;
        }

        .header p {
            color: #9a8c98;
            font-size: 13px;
        }

        .main-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.12);
            border: 3px solid #ffcad4;
            position: relative;
        }

        /* Mascot Area */
        .pet-bar {
            background: #ffe5ec;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border: 2px solid #ffb3c6;
        }

        .pet-avatar {
            font-size: 28px;
        }

        .pet-talk {
            font-size: 13px;
            font-weight: bold;
            color: #ff477e;
            flex: 1;
        }

        /* Nav Tabs */
        .tab-group {
            display: flex;
            background: #f8edeb;
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #b5838d;
            font-weight: bold;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #ff477e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* Content Sections */
        .content-sec {
            display: none;
        }

        .content-sec.active {
            display: block;
        }

        /* Flashcard Area */
        .card-frame {
            background: #fff0f3;
            border: 2px dashed #ff8fa3;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .card-badge {
            position: absolute;
            top: 12px;
            left: 14px;
            background: #ffb3c6;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 10px;
        }

        .illu-box {
            width: 70px;
            height: 70px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(255, 143, 163, 0.2);
            border: 2px solid #ffcad4;
        }

        .illu-box svg {
            width: 40px;
            height: 40px;
        }

        .word-eng {
            font-size: 28px;
            font-weight: 800;
            color: #ff477e;
            margin-bottom: 2px;
        }

        .word-phone {
            font-size: 13px;
            color: #a5a5a5;
            margin-bottom: 10px;
        }

        .word-kor {
            font-size: 20px;
            font-weight: bold;
            color: #3d5a80;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid #ffcad4;
            display: none;
            margin-bottom: 8px;
            width: 100%;
        }

        .word-ex {
            font-size: 12px;
            color: #6c757d;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 12px;
            border-radius: 10px;
            display: none;
            width: 100%;
            text-align: left;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-pink {
            background: #ff477e;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 71, 126, 0.25);
        }

        .btn-outline {
            background: #ffffff;
            border: 2px solid #ffcad4;
            color: #ff477e;
        }

        /* List View */
        .list-wrap {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .list-card {
            background: #fff8f9;
            border: 1px solid #ffcad4;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .list-mini-illu {
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ffcad4;
        }

        .list-mini-illu svg {
            width: 20px;
            height: 20px;
        }

        .list-info {
            flex: 1;
        }

        .list-eng {
            font-weight: bold;
            color: #ff477e;
            font-size: 15px;
        }

        .list-kor {
            font-size: 12px;
            color: #6c757d;
        }

        /* Quiz View */
        .quiz-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
        }

        .quiz-q {
            font-size: 24px;
            font-weight: bold;
            color: #ff477e;
            margin: 10px 0;
        }

        .quiz-opts {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .opt-btn {
            padding: 12px;
            background: #ffffff;
            border: 2px solid #ffcad4;
            border-radius: 12px;
            font-weight: bold;
            color: #4a4e69;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
        }

        .opt-btn.right {
            background: #e8f8f5;
            border-color: #2ec4b6;
            color: #0f5132;
        }

        .opt-btn.wrong {
            background: #ffeef0;
            border-color: #ff477e;
            color: #842029;
        }

        .progress-line {
            height: 8px;
            background: #ffe5ec;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-inner {
            height: 100%;
            background: #ff477e;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 중3 필수 영단어 Master</h1>
        <p>매일 하루 10분으로 영어 단어 완벽하게 공부하기!</p>
    </div>

    <div class="main-card">
        <!-- Mascot Bar -->
        <div class="pet-bar">
            <div class="pet-avatar">🐱</div>
            <div class="pet-talk" id="pet-msg">"안녕! 오늘도 같이 열심히 공부해보자냥!"</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('card')">🎴 단어 카드</button>
            <button class="tab-btn" onclick="switchTab('list')">📖 전체 단어장</button>
            <button class="tab-btn" onclick="switchTab('quiz')">🎮 퀴즈 테스트</button>
        </div>

        <!-- 1. CARD VIEW -->
        <div id="sec-card" class="content-sec active">
            <div class="card-frame">
                <span class="card-badge" id="card-idx">Word #1</span>
                
                <div class="illu-box" id="illu-box"></div>

                <div class="word-eng" id="card-eng">abandon</div>
                <div class="word-phone" id="card-phone">[əˈbændən]</div>
                
                <div class="word-kor" id="card-kor">버리다, 포기하다</div>
                <div class="word-ex" id="card-ex">
                    <strong>예문:</strong> Never abandon your dreams.<br>
                    <span style="color:#a5a5a5;">(당신의 꿈을 절대 포기하지 마세요.)</span>
                </div>
            </div>

            <button class="btn btn-outline" style="width: 100%; margin-bottom: 10px;" onclick="toggleAnswer()">
                👁️ 뜻 확인하기
            </button>

            <div class="btn-row">
                <button class="btn btn-outline" onclick="prevCard()">◀ 이전</button>
                <button class="btn btn-pink" onclick="nextCard()">다음 ▶</button>
            </div>
        </div>

        <!-- 2. LIST VIEW -->
        <div id="sec-list" class="content-sec">
            <div class="list-wrap" id="list-wrap"></div>
        </div>

        <!-- 3. QUIZ VIEW -->
        <div id="sec-quiz" class="content-sec">
            <div id="quiz-box-view">
                <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; color:#a5a5a5; margin-bottom:6px;">
                    <span id="quiz-step">문제 1 / 10</span>
                    <span id="quiz-score" style="color:#ff477e;">0점</span>
                </div>
                <div class="quiz-box">
                    <div style="font-size:12px; color:#ff477e; font-weight:bold;">알맞은 뜻을 찾으세요!</div>
                    <div class="quiz-q" id="quiz-q-word">abandon</div>
                </div>
                <div class="quiz-opts" id="quiz-opts"></div>
            </div>

            <div id="quiz-result-view" style="display:none; text-align:center; padding: 20px 0;">
                <div style="font-size: 40px; margin-bottom: 10px;">🏆</div>
                <h2 style="color:#ff477e; margin-bottom: 6px;">퀴즈 테스트 완료!</h2>
                <div style="font-size: 32px; font-weight:800; color:#ff477e; margin-bottom:10px;" id="final-score">100점</div>
                <p style="font-size:13px; color:#6c757d; margin-bottom: 16px;">오늘 공부한 단어를 잘 외우고 있네요!</p>
                <button class="btn btn-pink" onclick="startQuiz()">🔄 다시 도전하기</button>
            </div>
        </div>

        <div class="progress-line">
            <div class="progress-inner" id="progress-inner"></div>
        </div>
    </div>

    <script>
        var svgIcons = {
            star: '<svg viewBox="0 0 24 24" fill="#ffb703"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
            heart: '<svg viewBox="0 0 24 24" fill="#ff477e"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
            book: '<svg viewBox="0 0 24 24" fill="#4ea8de"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>'
        };

        var vocabList = [
            { id: 1, word: "abandon", phone: "[əˈbændən]", meaning: "버리다, 포기하다", exEn: "Never abandon your dreams.", exKo: "당신의 꿈을 절대 포기하지 마세요.", icon: "heart" },
            { id: 2, word: "benefit", phone: "[ˈbenɪfɪt]", meaning: "혜택, 이익", exEn: "Fresh air has many benefits.", exKo: "신선한 공기는 많은 혜택이 있다.", icon: "star" },
            { id: 3, word: "candidate", phone: "[ˈkændɪdət]", meaning: "후보자, 지원자", exEn: "She is a top candidate for the job.", exKo: "그녀는 유력한 후보자이다.", icon: "book" },
            { id: 4, word: "delicate", phone: "[ˈdelɪkət]", meaning: "섬세한, 우아한", exEn: "The flower petals are delicate.", exKo: "꽃잎이 매우 섬세하다.", icon: "heart" },
            { id: 5, word: "efficient", phone: "[ɪˈfɪʃnt]", meaning: "효율적인", exEn: "We need an efficient study plan.", exKo: "효율적인 공부 계획이 필요하다.", icon: "star" },
            { id: 6, word: "frequently", phone: "[ˈfriːkwəntli]", meaning: "자주, 흔히", exEn: "I visit the library frequently.", exKo: "나는 도서관을 자주 방문한다.", icon: "book" },
            { id: 7, word: "guarantee", phone: "[ˌɡærənˈtiː]", meaning: "보장하다, 약속하다", exEn: "I guarantee you will like this.", exKo: "네가 이것을 좋아할 것이라 보장해.", icon: "star" },
            { id: 8, word: "hesitate", phone: "[ˈhezɪteɪt]", meaning: "망설이다, 주저하다", exEn: "Don't hesitate to ask questions.", exKo: "망설이지 말고 질문하세요.", icon: "heart" },
            { id: 9, word: "ingredient", phone: "[ɪnˈɡriːdiənt]", meaning: "재료, 성분", exEn: "Fresh ingredients make good food.", exKo: "신선한 재료가 좋은 요리를 만든다.", icon: "star" },
            { id: 10, word: "justify", phone: "[ˈdʒʌstɪfaɪ]", meaning: "정당화하다", exEn: "Nothing can justify hurting others.", exKo: "남을 해치는 건 정당화될 수 없다.", icon: "book" }
        ];

        var curIdx = 0;
        var showKor = false;
        var quizIdx = 0;
        var quizScoreVal = 0;
        var quizList = [];

        function switchTab(tab) {
            var btns = document.querySelectorAll('.tab-btn');
            var secs = document.querySelectorAll('.content-sec');
            for(var i=0; i<btns.length; i++) btns[i].classList.remove('active');
            for(var i=0; i<secs.length; i++) secs[i].classList.remove('active');

            if(tab === 'card') {
                btns[0].classList.add('active');
                document.getElementById('sec-card').classList.add('active');
                renderCard();
            } else if(tab === 'list') {
                btns[1].classList.add('active');
                document.getElementById('sec-list').classList.add('active');
                renderList();
            } else if(tab === 'quiz') {
                btns[2].classList.add('active');
                document.getElementById('sec-quiz').classList.add('active');
                startQuiz();
            }
        }

        function renderCard() {
            var item = vocabList[curIdx];
            document.getElementById('card-idx').innerText = 'Word #' + (curIdx + 1) + ' / ' + vocabList.length;
            document.getElementById('illu-box').innerHTML = svgIcons[item.icon] || svgIcons.star;
            document.getElementById('card-eng').innerText = item.word;
            document.getElementById('card-phone').innerText = item.phone;
            document.getElementById('card-kor').innerText = item.meaning;
            document.getElementById('card-ex').innerHTML = '<strong>예문:</strong> ' + item.exEn + '<br><span style="color:#a5a5a5;">(' + item.exKo + ')</span>';

            showKor = false;
            document.getElementById('card-kor').style.display = 'none';
            document.getElementById('card-ex').style.display = 'none';

            var pct = Math.round(((curIdx + 1) / vocabList.length) * 100);
            document.getElementById('progress-inner').style.width = pct + '%';
        }

        function toggleAnswer() {
            showKor = !showKor;
            var disp = showKor ? 'block' : 'none';
            document.getElementById('card-kor').style.display = disp;
            document.getElementById('card-ex').style.display = disp;
        }

        function nextCard() {
            curIdx = (curIdx + 1) % vocabList.length;
            renderCard();
        }

        function prevCard() {
            curIdx = (curIdx - 1 + vocabList.length) % vocabList.length;
            renderCard();
        }

        function renderList() {
            var wrap = document.getElementById('list-wrap');
            wrap.innerHTML = '';

            for(var i=0; i<vocabList.length; i++) {
                var item = vocabList[i];
                var div = document.createElement('div');
                div.className = 'list-card';
                div.innerHTML = 
                    '<div class="list-mini-illu">' + (svgIcons[item.icon] || svgIcons.star) + '</div>' +
                    '<div class="list-info">' +
                        '<div class="list-eng">' + item.word + ' <span style="font-size:11px; color:#aaa;">' + item.phone + '</span></div>' +
                        '<div class="list-kor">' + item.meaning + '</div>' +
                    '</div>';
                wrap.appendChild(div);
            }
        }

        function startQuiz() {
            quizIdx = 0;
            quizScoreVal = 0;
            quizList = vocabList.slice().sort(function(){ return 0.5 - Math.random(); });

            document.getElementById('quiz-box-view').style.display = 'block';
            document.getElementById('quiz-result-view').style.display = 'none';
            renderQuizQ();
        }

        function renderQuizQ() {
            var q = quizList[quizIdx];
            document.getElementById('quiz-step').innerText = '문제 ' + (quizIdx + 1) + ' / ' + quizList.length;
            document.getElementById('quiz-score').innerText = quizScoreVal + '점';
            document.getElementById('quiz-q-word').innerText = q.word;

            var others = [];
            for(var i=0; i<vocabList.length; i++) {
                if(vocabList[i].word !== q.word) others.push(vocabList[i].meaning);
            }
            others.sort(function(){ return 0.5 - Math.random(); });

            var opts = [q.meaning, others[0], others[1], others[2]];
            opts.sort(function(){ return 0.5 - Math.random(); });

            var box = document.getElementById('quiz-opts');
            box.innerHTML = '';

            for(var k=0; k<opts.length; k++) {
                var btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = (k+1) + '. ' + opts[k];
                btn.onclick = (function(ans){
                    return function() { checkQuizAns(this, ans === q.meaning); };
                })(opts[k]);
                box.appendChild(btn);
            }
        }

        function checkQuizAns(btn, isRight) {
            var btns = document.querySelectorAll('.opt-btn');
            for(var i=0; i<btns.length; i++) btns[i].disabled = true;

            if(isRight) {
                btn.classList.add('right');
                quizScoreVal += 10;
            } else {
                btn.classList.add('wrong');
                for(var j=0; j<btns.length; j++) {
                    if(btns[j].innerText.indexOf(quizList[quizIdx].meaning) !== -1) {
                        btns[j].classList.add('right');
                    }
                }
            }

            setTimeout(function(){
                quizIdx++;
                if(quizIdx < quizList.length) {
                    renderQuizQ();
                } else {
                    showQuizResult();
                }
            }, 800);
        }

        function showQuizResult() {
            document.getElementById('quiz-box-view').style.display = 'none';
            document.getElementById('quiz-result-view').style.display = 'block';
            document.getElementById('final-score').innerText = quizScoreVal + '점';
        }

        window.onload = function() {
            renderCard();
        };
    </script>
</body>
</html>
